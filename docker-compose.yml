services:
  postgres:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: hermes-memory-postgres:local
    container_name: hermes-memory-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${HERMES_PG_PASSWORD:?set HERMES_PG_PASSWORD in .env}
      POSTGRES_DB: hermes_memory
    ports:
      # Host 5432 is commonly taken (other Postgres containers on this host);
      # expose on 5450 instead. DSNs must use port 5450.
      - "127.0.0.1:5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_memory"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
