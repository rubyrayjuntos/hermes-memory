<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Memory — Knowledge Graph</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #1e293b; padding: 12px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
  header .subtitle { font-size: 12px; color: #94a3b8; }
  #search-bar {
    flex: 1; max-width: 400px; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569;
    background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none;
  }
  #search-bar:focus { border-color: #3b82f6; }
  #stats { font-size: 12px; color: #94a3b8; }
  #api-status { font-size: 11px; padding: 4px 8px; border-radius: 4px; }
  .api-ok { background: #065f46; color: #6ee7b7; }
  .api-err { background: #991b1b; color: #fca5a5; }
  main { flex: 1; display: flex; overflow: hidden; }
  #graph-container { flex: 1; position: relative; }
  #sidebar {
    width: 360px; background: #1e293b; border-left: 1px solid #334155; overflow-y: auto;
    padding: 16px; display: none;
  }
  #sidebar.visible { display: block; }
  #sidebar h2 { font-size: 14px; color: #f1f5f9; margin-bottom: 8px; }
  #sidebar .meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
  .edge-list { list-style: none; }
  .edge-list li { font-size: 12px; padding: 4px 0; color: #cbd5e1; border-bottom: 1px solid #334155; }
  .edge-list li:last-child { border: none; }
  .label-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
    text-transform: uppercase;
  }
  .label-Person { background: #7c3aed; color: white; }
  .label-Project { background: #2563eb; color: white; }
  .label-Technology { background: #059669; color: white; }
  .label-Organization { background: #dc2626; color: white; }
  .label-Domain { background: #d97706; color: white; }
  .label-Concept { background: #6b7280; color: white; }
  .label-Tool { background: #0891b2; color: white; }
  .label-Skill { background: #be185d; color: white; }
  .label-Module { background: #4f46e5; color: white; }
  .label-Dependency { background: #65a30d; color: white; }
  .label-Standard { background: #b45309; color: white; }
  .close-btn {
    position: absolute; top: 8px; right: 8px; background: none; border: none; color: #94a3b8;
    font-size: 20px; cursor: pointer;
  }
  .close-btn:hover { color: #f1f5f9; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 14px; }
  .legend {
    position: absolute; bottom: 16px; left: 16px; background: rgba(30,41,59,0.9); padding: 12px;
    border-radius: 8px; font-size: 11px; border: 1px solid #334155;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🧠 Hermes Memory — Knowledge Graph</h1>
    <div class="subtitle">Postgres + Apache AGE + pgvector</div>
  </div>
  <input type="text" id="search-bar" placeholder="Search nodes... (e.g. Tokyo Eye, Postgres, Ray Swan)">
  <span id="api-status">API: checking...</span>
  <div id="stats">Loading...</div>
</header>
<main>
  <div id="graph-container">
    <div id="loading">Connecting to librarian API at 127.0.0.1:7890...</div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="sidebar">
    <button class="close-btn" onclick="closeSidebar()">&times;</button>
    <div id="sidebar-content"></div>
  </div>
</main>
<script>
const API_BASE = 'http://127.0.0.1:7890/api/librarian';
const LABEL_COLORS = {
  Person: '#7c3aed', Project: '#2563eb', Technology: '#059669',
  Organization: '#dc2626', Domain: '#d97706', Concept: '#6b7280',
  Tool: '#0891b2', Skill: '#be185d', Module: '#4f46e5',
  Dependency: '#65a30d', Standard: '#b45309'
};

let network = null;
let allNodes = [];
let allEdges = [];
let nodeMap = {};
let apiAvailable = false;

async function checkApi() {
  try {
    const resp = await fetch(API_BASE + '/search/nodes?q=a', { signal: AbortSignal.timeout(2000) });
    apiAvailable = resp.ok;
    const el = document.getElementById('api-status');
    el.textContent = apiAvailable ? 'API: ✓ connected' : 'API: ✗ offline';
    el.className = apiAvailable ? 'api-ok' : 'api-err';
  } catch {
    const el = document.getElementById('api-status');
    el.textContent = 'API: ✗ offline';
    el.className = 'api-err';
  }
}

async function loadGraph() {
  await checkApi();

  if (!apiAvailable) {
    document.getElementById('loading').innerHTML =
      '<b>Librarian API not available</b><br>Start it with: librarian-cli serve<br>Then refresh this page.';
    return;
  }

  try {
    // Load nodes from search API (paginate through all)
    const nodes = new Map();
    const edgesSet = new Set();
    const queries = ['a', 'e', 'i', 'o', 't', 'n', 'r', 's'];

    for (const q of queries) {
      for (let page = 1; page <= 10; page++) {
        const url = `${API_BASE}/search/nodes?q=${encodeURIComponent(q)}&page=${page}`;
        const resp = await fetch(url);
        if (!resp.ok) break;
        const data = await resp.json();
        if (!data.results || data.results.length === 0) break;

        for (const n of data.results) {
          if (!nodes.has(n.id)) {
            nodes.set(n.id, { ...n, degree: 0 });
          }
        }

        // Load edges for each new node
        for (const n of data.results) {
          if (!nodes.has(n.id)) continue;
          try {
            const detailResp = await fetch(`${API_BASE}/nodes/${n.id}`);
            if (!detailResp.ok) continue;
            const detail = await detailResp.json();
            for (const e of (detail.incoming || [])) {
              const key = `${e.id}->${n.id}:${e.rel}`;
              if (!edgesSet.has(key)) {
                edgesSet.add(key);
                edges.push({ from: e.id, to: n.id, label: e.rel });
                nodes.get(e.id)?.name || nodes.set(e.id, { id: e.id, label: e.label, name: e.name, degree: 0 });
                nodes.get(n.id).degree++;
                nodes.get(e.id).degree = (nodes.get(e.id).degree || 0) + 1;
              }
            }
            for (const e of (detail.outgoing || [])) {
              const key = `${n.id}->${e.id}:${e.rel}`;
              if (!edgesSet.has(key)) {
                edgesSet.add(key);
                edges.push({ from: n.id, to: e.id, label: e.rel });
                nodes.get(e.id)?.name || nodes.set(e.id, { id: e.id, label: e.label, name: e.name, degree: 0 });
                nodes.get(n.id).degree++;
                nodes.get(e.id).degree = (nodes.get(e.id).degree || 0) + 1;
              }
            }
          } catch {}
        }

        if (data.results.length < 50) break;
      }
    }

    allNodes = Array.from(nodes.values());
    allEdges = edges;

    // Update stats
    document.getElementById('stats').textContent =
      `${allNodes.length} nodes · ${allEdges.length} edges`;

    // Build legend
    const labels = [...new Set(allNodes.map(n => n.label))];
    const legend = document.getElementById('legend');
    legend.innerHTML = '<strong>Labels</strong>' + labels.map(l =>
      `<div class="legend-item"><span class="legend-dot" style="background:${LABEL_COLORS[l] || '#888'}"></span>${l}</div>`
    ).join('');

    renderGraph(allNodes, allEdges);
    document.getElementById('loading').style.display = 'none';
  } catch (err) {
    document.getElementById('loading').innerHTML =
      '<b>Error loading graph</b><br>' + err.message;
  }
}

function renderGraph(nodes, edges) {
  const visNodes = new vis.DataSet(nodes.map(n => ({
    id: String(n.id),
    label: n.name || String(n.id),
    title: `${n.label}: ${n.name || n.id}\nDegree: ${n.degree || 0}`,
    color: { background: LABEL_COLORS[n.label] || '#888', border: '#fff' },
    font: { color: '#e2e8f0', size: 12 },
    size: Math.min(8 + (n.degree || 0) * 0.3, 25),
  })));

  const visEdges = new vis.DataSet(edges.map(e => ({
    from: String(e.from),
    to: String(e.to),
    label: e.label || '',
    font: { color: '#94a3b8', size: 9 },
    color: { color: '#475569', highlight: '#3b82f6' },
  })));

  const container = document.getElementById('graph-container');
  const data = { nodes: visNodes, edges: visEdges };
  const options = {
    physics: { stabilization: true, barnesHut: { gravitationalConstant: -2000, springLength: 100 } },
    interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true },
  };

  if (network) network.destroy();
  network = new vis.Network(container, data, options);

  network.on('click', params => {
    if (params.nodes.length > 0) showNode(params.nodes[0]);
  });

  network.on('doubleClick', params => {
    if (params.nodes.length > 0) {
      const vid = params.nodes[0];
      const name = nodeMap[vid]?.name || vid;
      if (confirm(`Delete node "${name}" and its edges?\n\nThis cannot be undone.`)) {
        visNodes.remove(vid);
        const toRemove = visEdges.get().filter(e => e.from === vid || e.to === vid);
        visEdges.remove(toRemove);
        closeSidebar();
      }
    }
  });
}

function showNode(vid) {
  const node = nodeMap[vid];
  if (!node) return;
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('sidebar-content');
  const incoming = allEdges.filter(e => String(e.to) === String(vid));
  const outgoing = allEdges.filter(e => String(e.from) === String(vid));

  content.innerHTML = `
    <h2><span class="label-badge label-${node.label}">${node.label}</span> ${node.name || vid}</h2>
    <div class="meta">ID: ${vid} · Degree: ${node.degree || 0}</div>
    ${incoming.length ? `<h3>Incoming (${incoming.length})</h3><ul class="edge-list">${incoming.slice(0,20).map(e => {
      const src = nodeMap[e.from];
      return `<li>${src?.label || '?'} ${src?.name || e.from} -[${e.label}]→</li>`;
    }).join('')}</ul>` : ''}
    ${outgoing.length ? `<h3>Outgoing (${outgoing.length})</h3><ul class="edge-list">${outgoing.slice(0,20).map(e => {
      const tgt = nodeMap[e.to];
      return `<li>→ [${e.label}]- ${tgt?.label || '?'} ${tgt?.name || e.to}</li>`;
    }).join('')}</ul>` : ''}
  `;
  sidebar.classList.add('visible');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('visible');
}

// Search filter
document.getElementById('search-bar').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { renderGraph(allNodes, allEdges); return; }
  const matched = allNodes.filter(n => (n.name || '').toLowerCase().includes(q));
  const matchedIds = new Set(matched.map(n => String(n.id)));
  const relatedEdges = allEdges.filter(e => matchedIds.has(String(e.from)) || matchedIds.has(String(e.to)));
  renderGraph(matched, relatedEdges);
});

// Init
loadGraph();
</script>
</body>
</html>
