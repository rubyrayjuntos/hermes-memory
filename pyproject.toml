[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory"
version = "0.1.0"
description = "Postgres + Apache AGE Vector & Graph Database with prompt context injection for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ray Swan", email = "rswan@rswan.org"},
]
keywords = ["hermes", "memory", "pgvector", "apache-age", "graph", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psycopg>=3.0",
    "asyncpg>=0.29",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
hermes-memory-ingest = "hermes_memory.ingest:main"
hermes-memory-verify = "hermes_memory.verify:main"

[project.entry-points."hermes_agent.memory_providers"]
hybrid-age = "hermes_memory:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "property: pure-function Hypothesis property tests (P1-P8)",
    "integration: DB-backed tests requiring docker / a live compose stack",
]
