name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  property:
    name: property tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (pipx + poetry)
        run: |
          python -m pip install --upgrade pip
          pipx install poetry
          poetry install --with dev || pip install -e ".[dev]"
      - name: Property tests (P1-P8)
        run: |
          poetry run pytest tests/property -q || pytest tests/property -q

  integration:
    name: integration (pgvector service)
    runs-on: ubuntu-latest
    needs: property
    services:
      postgres:
        image: ankane/pgvector:pg16
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      HERMES_PG_PASSWORD: ci-local-password
      HYBRID_AGE_DSN: postgres://hermes:ci-local-password@localhost:5432/hermes_test
      PG_DSN_HERMES_TEST: postgres://hermes:ci-local-password@localhost:5432/hermes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pipx + poetry)
        run: |
          python -m pip install --upgrade pip
          pipx install poetry
          poetry install --with dev || pip install -e ".[dev]"
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U hermes && break
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U hermes
          psql "$HYBRID_AGE_DSN" -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          psql "$HYBRID_AGE_DSN" -c "SELECT 1;" || psql "postgres://hermes:ci-local-password@localhost:5432/postgres" -c "CREATE DATABASE hermes_test OWNER hermes;" || true
      - name: Run migrations (--migrate)
        run: |
          poetry run python scripts/migrate.py --dsn "$HYBRID_AGE_DSN" || python scripts/migrate.py --dsn "$HYBRID_AGE_DSN"
      - name: Integration + store + idempotent tests
        run: |
          poetry run pytest -q --migrate --override-ini="addopts=" -m "integration or store or idempotent" || pytest -q --migrate --override-ini="addopts=" -m "integration or store or idempotent"
      - name: Isolated fixture guard (no prod DB touched)
        run: |
          if grep -r "hermes_memory" tests/test_store.py tests/test_migrate_idempotent.py 2>/dev/null | grep -v hermes_test | grep -v "#"; then
            echo "Guard: tests must use hermes_test, not hermes_memory prod DB"; exit 1; fi
          echo "Isolation guard passed — tests use hermes_test"
      - name: Unit + property (no integration) still green
        run: |
          poetry run pytest -q -m "not integration" || pytest -q -m "not integration"

  nightly-ollama-e2e:
    name: nightly ollama e2e (stub)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — ollama e2e
        run: |
          echo "TODO(v0.2): install ollama, pull nomic-embed-text, run full "
          echo "embed-backed pipeline e2e. Stubbed out of PR CI by design."
