name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly ollama e2e (stubbed below) — 03:17 UTC.
    - cron: "17 3 * * *"

jobs:
  unit:
    name: property tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Property tests (P1-P8)
        run: pytest tests/property -q

  integration:
    name: integration (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bring up stack
        run: |
          cat > .env <<ENVFILE
          HERMES_PG_PASSWORD=ci-local-password
          ENVFILE
          docker compose up -d --wait
      - name: Integration tests
        env:
          HERMES_PG_PASSWORD: ci-local-password
          HYBRID_AGE_DSN: postgres://hermes:ci-local-password@localhost:5450/hermes_memory
        run: pytest tests/integration -q -m integration --override-ini="addopts="
      - name: verify.py harness
        env:
          HERMES_PG_PASSWORD: ci-local-password
          HYBRID_AGE_DSN: postgres://hermes:ci-local-password@localhost:5450/hermes_memory
        run: python -m hermes_memory.verify
      - name: Teardown
        if: always()
        run: docker compose down -v

  nightly-ollama-e2e:
    name: nightly ollama e2e (stub)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — ollama e2e
        run: |
          echo "TODO(v0.2): install ollama, pull nomic-embed-text, run full "
          echo "embed-backed pipeline e2e. Stubbed out of PR CI by design."
