name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Write-path log ban
        run: |
          # Live write modules: Exception handlers must not hide at debug.
          # Use grep (preinstalled on ubuntu-latest). ripgrep is not on the runner.
          if grep -REn 'logger\.debug\([^)]*exc_info' \
               src/hermes_memory/provider.py \
               src/hermes_memory/store.py \
               src/hermes_memory/store_merge.py \
               src/hermes_memory/store_concepts.py \
               src/hermes_memory/about_concepts.py \
               src/hermes_memory/ingest.py \
               src/hermes_memory/graph_runtime.py \
             | grep -Ev 'purge_verify|purge verify|shutdown|loop stop|pool close|incomplete init|purge_concept|prune_orphan|prune orphan|fetch_concept|loop close|embedder init|optional SQL count|count cypher|Garden noun|ghost knn|node fetch|taxonomy backfill|ensure_about|Turn vertex|Session vertex|NEXT edge|Concept vertex|turn edge|bridge_turn'; then
            echo "write-path Exception logged at debug"; exit 1
          fi
      - name: Mypy (extracted modules)
        run: mypy

  property:
    name: property tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Property tests (P1-P8)
        run: pytest tests/property -q

  integration:
    name: integration (pgvector service)
    runs-on: ubuntu-latest
    needs: property
    env:
      HERMES_PG_PASSWORD: ci-local-password
      HYBRID_AGE_DSN: postgres://hermes:ci-local-password@localhost:5432/hermes_test
      PG_DSN_HERMES_TEST: postgres://hermes:ci-local-password@localhost:5432/hermes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build postgres image (AGE + pgvector)
        run: |
          docker build -t hermes-memory-postgres:ci -f docker/Dockerfile .
      - name: Start postgres (AGE+vector) on 5432
        run: |
          docker run -d --name hermes_pg_ci \
            -e POSTGRES_USER=hermes \
            -e POSTGRES_PASSWORD=ci-local-password \
            -e POSTGRES_DB=hermes_test \
            -p 5432:5432 \
            --health-cmd "pg_isready -U hermes -d hermes_test" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            hermes-memory-postgres:ci
          echo "postgres container started: hermes_pg_ci"
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U hermes && break
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U hermes
          PGPASSWORD="$HERMES_PG_PASSWORD" psql -h localhost -p 5432 -U hermes -d hermes_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          PGPASSWORD="$HERMES_PG_PASSWORD" psql -h localhost -p 5432 -U hermes -d hermes_test -c "SELECT 1;" || PGPASSWORD="$HERMES_PG_PASSWORD" psql -h localhost -p 5432 -U hermes -d postgres -c "CREATE DATABASE hermes_test OWNER hermes;" || true
      - name: Run migrations (--migrate)
        run: |
          PGPASSWORD="$HERMES_PG_PASSWORD" python scripts/migrate.py --dsn "postgres://hermes@localhost:5432/hermes_test"
      - name: Integration + store + idempotent tests
        run: |
          # No silent -k excludes. Smoke tests use HYBRID_AGE_DSN (5432/hermes_test).
          pytest -q --migrate --override-ini="addopts=" -m "integration or store or idempotent"
      - name: Isolated fixture guard (no prod DB touched)
        run: |
          if grep -E 'postgres.*hermes_memory' tests/test_store.py tests/test_migrate_idempotent.py 2>/dev/null | grep -v 'not in dsn' | grep -v 'import hermes_memory' | grep -q .; then
            echo "Guard: tests must use hermes_test DSN, not hermes_memory prod DB"; exit 1; fi
          echo "Isolation guard passed — tests use hermes_test"
      - name: Unit + property (no integration) still green
        run: |
          pytest -q -m "not integration"

  nightly-ollama-e2e:
    name: nightly ollama e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 45
    env:
      HERMES_PG_PASSWORD: ci-local-password
      HYBRID_AGE_DSN: postgres://hermes:ci-local-password@localhost:5432/hermes_test
      HYBRID_AGE_EMBED_URL: http://127.0.0.1:11434/v1
      HYBRID_AGE_EMBED_MODEL: nomic-embed-text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build postgres image (AGE + pgvector)
        run: docker build -t hermes-memory-postgres:ci -f docker/Dockerfile .
      - name: Start postgres (AGE+vector) on 5432
        run: |
          docker run -d --name hermes_pg_ci \
            -e POSTGRES_USER=hermes \
            -e POSTGRES_PASSWORD=ci-local-password \
            -e POSTGRES_DB=hermes_test \
            -p 5432:5432 \
            --health-cmd "pg_isready -U hermes -d hermes_test" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            hermes-memory-postgres:ci
      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U hermes && break
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U hermes
      - name: Run migrations
        run: |
          PGPASSWORD="$HERMES_PG_PASSWORD" python scripts/migrate.py --dsn "postgres://hermes@localhost:5432/hermes_test"
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/tags
      - name: Pull nomic-embed-text
        run: ollama pull nomic-embed-text
      - name: Verify pipeline with live embeddings
        run: hermes-memory-verify --dsn "$HYBRID_AGE_DSN" --require-embed
