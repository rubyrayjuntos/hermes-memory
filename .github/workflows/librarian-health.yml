name: librarian-health
on:
  schedule:
    - cron: "0 9 * * *"  # daily 09:00 UTC — drift watch
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: hermes_memory
        ports:
          - 5450:5432
        options: >-
          --health-cmd="pg_isready -U hermes -d hermes_memory"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Wait for Postgres
        run: until pg_isready -h 127.0.0.1 -p 5450 -U hermes; do sleep 1; done
        env:
          PGPASSWORD: ci-local-password
      - name: Run scoped health check
        id: health
        continue-on-error: true
        env:
          HYBRID_AGE_DSN: postgres://hermes:ci-local-password@127.0.0.1:5450/hermes_memory
          HERMES_PG_PASSWORD: ci-local-password
        run: |
          python scripts/librarian_health.py --fail-on-drift --json /tmp/health.json
          echo "exit=$?"
          cat /tmp/health.json
      - name: Open drift issue on failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="Automated drift detected (Store.librarian_health() scoped to file-backed rows only, issue #17). See health JSON."
          cat /tmp/health.json 2>/dev/null || true
          gh issue create --title "drift: librarian scoped health failed $(date -u +%Y-%m-%d)" --body "$BODY" --label "bug" || echo "issue create failed (may already exist)"
