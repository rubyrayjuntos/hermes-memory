# Phase 2 (write, gated): maintainer-invoked /oc or /opencode commands.
# The repo-agent orchestrator reads the request and delegates to a specialist.
name: opencode-command

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  command:
    # Only run on explicit /oc or /opencode, and only for users who can write to the
    # repo (maintainers). This gates all write-capable agent work behind a human.
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write        # bugfix delegation may create branches/commits
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configure bot git identity (github-actions[bot])
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4 # github-v1.2.25
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: model_api/muse-spark-1.1
          agent: repo-agent
          use_github_token: true
